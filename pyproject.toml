[project]
name = "local-enough"
version = "0.1.0"
description = "Measure whether a back-office AI task can run on your own hardware, and route each task to the cheapest model that meets your quality bar."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/local_enough/data/datasets/classification/LICENSE-BANKING77.txt"]
authors = [{ name = "Andrii Boiko" }]
keywords = ["llm", "local-llm", "mlx", "benchmark", "llm-router", "tco", "openai-compatible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface-hub>=0.24",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "psutil>=6.0",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
local-enough = "local_enough.cli:app"

[project.urls]
Homepage = "https://github.com/B0yko/local-enough"
Issues = "https://github.com/B0yko/local-enough/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "openai>=1.40",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-psutil",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_enough"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "examples", "README.md", "LICENSE", "NOTICE", "DATASETS.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/local_enough"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "rapidfuzz.*", "matplotlib.*", "mlx_lm.*", "mlx.*", "huggingface_hub.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
