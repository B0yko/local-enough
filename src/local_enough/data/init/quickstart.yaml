# Quickstart config: one inexpensive OpenRouter model plus the three non-LLM baselines.
# Live, one key, under $0.05 with --split calib --limit 10 (see the README quickstart).
project: local-enough-quickstart
budget_usd: 0.5
budget_warn_usd: 0.4

models:
  - id: quickstart-model
    kind: cloud
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3-235b-a22b-2507

  - id: tfidf-baseline
    kind: baseline
    task: classification

  - id: regex-baseline
    kind: baseline
    task: pii_redaction

  - id: rapidfuzz-baseline
    kind: baseline
    task: entity_matching
