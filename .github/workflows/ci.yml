name: CI

on:
  push:
  pull_request:

# No secrets are used anywhere in this workflow and no job calls a paid API. Live benchmark runs
# (bench, judge calibrate/score, route replay) only ever run locally, from the CLI.
permissions:
  contents: read

jobs:
  test:
    name: lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  readme-numbers:
    name: README numbers match the reference run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check README tables against the committed reference run
        run: uv run python scripts/check_readme.py

  docker:
    name: router image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the router image
        run: docker build -t local-enough:ci .

      - name: Start the router on the reference plan (dummy key, no backend is called)
        run: |
          docker run -d --name router -p 127.0.0.1:8000:8000 \
            -e OPENROUTER_API_KEY=ci-dummy-key \
            -v "$PWD/examples/docker/config.yaml:/config/config.yaml:ro" \
            --add-host=host.docker.internal:host-gateway \
            local-enough:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done

      - name: /healthz returns 200 and /v1/models lists the task aliases
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/v1/models | tee models.json
          python3 -c "import json; ids = {m['id'] for m in json.load(open('models.json'))['data']}; \
          need = {f'local-enough/{t}' for t in ['classification', 'extraction', 'pii_redaction', 'summarisation', 'entity_matching']}; \
          missing = need - ids; assert not missing, missing"

      - name: Router logs
        if: always()
        run: docker logs router
