name: CI

on:
  push:
  pull_request:

# No secrets are used anywhere in this workflow and no job calls a paid API. Live benchmark runs
# (bench, judge calibrate/score, route replay) only ever run locally, from the CLI.
permissions:
  contents: read

jobs:
  test:
    name: lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  readme-numbers:
    name: README numbers match the reference run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check README tables against the committed reference run
        run: uv run python scripts/check_readme.py

  # TODO(docker): build the router image and run the container smoke test (/healthz, /v1/models
  # against fake backends) once the route package lands. Push to GHCR happens only on a version tag,
  # in a separate release workflow with GITHUB_TOKEN, never here.
